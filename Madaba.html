<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>لوحة النظام – مادبا</title>
<link rel="icon" type="image/png" href="data/moh_logo.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
  :root{ --bg:#061022; --card:#0b1324; --text:#eaf3ff; --muted:#9db2ce; --border:#1c2a4e; --accent:#10b981; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Kufi Arabic","Noto Sans Arabic",sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:#0f172a}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#22c55e55,#0ea5e955)}
  .title{font-weight:900}
  .logout{cursor:pointer;background:#ef4444;border:0;color:#fff;padding:8px 12px;border-radius:10px;font-weight:800}
  main{flex:1;display:grid;place-items:center;padding:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:min(1000px,92vw)}
  .tile{cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 20px rgba(0,0,0,.25), inset 0 0 0 1px #0d223f;text-decoration:none;color:var(--text)}
  .tile:hover{outline:1px solid #2563eb}
  .tile .icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#22c55e66,#0ea5e966)}
  .tile .name{font-weight:900;font-size:18px}
  .tile .sub{color:var(--muted);font-size:12px;margin-top:4px}
  footer{padding:10px 16px;color:var(--muted);border-top:1px solid var(--border);text-align:center}
</style>
</head>
<body>
<script src="auth.js"></script>
<script>requireAuth();</script>

<header>
  <div class="brand">
    <div class="logo"><img src="data/moh_logo.png" alt="شعار" style="width:100%;height:100%;object-fit:contain;border-radius:10px;background:#fff;padding:2px"></div>
    <div class="title">الصفحة الرئيسية</div>
  </div>
  <button class="logout" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> خروج</button>
</header>

<main>
  <div class="grid">
    <!-- بطاقة مادبا -->
    <a class="tile" href="Madaba_map_V9.html">

      <div class="icon"><i class="fa-solid fa-map-location-dot"></i></div>
      <div>
        <div class="name">مادبا</div>
        <div class="sub">خريطة أحواض مادبا – مديرية أشغال محافظة مأدبا</div>
      </div>
    </a>
    <a class="tile" href="MadabaPage2.html">
  <div class="icon"><i class="fa-solid fa-layer-group"></i></div>
  <div>
    <div class="name">مادبا صفحة2</div>
    <div class="sub">صفحة داخلية إضافية</div>
  </div>
</a>

    <!-- يمكنك إضافة بطاقات أخرى لاحقًا بنفس النمط -->
  </div>
</main>

<footer>مديرية أشغال مأدبا — إعداد وتصميم: م. أحمد الزن</footer>
</body>
</html>
