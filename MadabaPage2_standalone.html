<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مادبا 2 — صفحة مستقلة</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body{margin:0;background:#0b1224;color:#e5e7eb;font-family:system-ui,Segoe UI,Tahoma}
    header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#0f172a;border-bottom:1px solid #1f2937}
    header .title{font-weight:800}
    #map{height:calc(100vh - 56px)}
    .toolbar{position:fixed;inset:auto 12px 12px auto;z-index:9999;background:#0f172a;border:1px solid #1f2937;border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center}
    .btn{background:#111827;color:#e5e7eb;border:1px solid #1f2937;border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .badge{padding:2px 8px;border-radius:9999px;background:#1f2937}
    @media print{
      body{background:#fff}
      header{display:block}
      .toolbar{display:none}
      #map{height:85vh}
    }
  </style>
</head>
<body>
  <header>
    <div class="title">مادبا 2 — خريطة مستقلة</div>
    <div class="badge" id="status">جاهز</div>
  </header>
  <div id="map"></div>

  <div class="toolbar">
    <button class="btn" id="btnLoad2026">تحميل 2026.json</button>
    <button class="btn" id="btnClear">إزالة الطبقة</button>
    <button class="btn" id="btnPrint">طباعة</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (function(){
    // مساحة أسماء معزولة
    const M2 = window.madaba2 = { map:null, layers:new Map() };

    function setStatus(txt){ document.getElementById('status').textContent = txt; }

    // تهيئة الخريطة
    const map = M2.map = L.map('map',{preferCanvas:true}).setView([31.72,35.80], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // تحميل طبقة GeoJSON عند الطلب
    async function ensureLayer(id, url, style){
      if(M2.layers.has(id)){ const lyr=M2.layers.get(id); lyr.addTo(map); return lyr; }
      setStatus('تحميل الطبقة…');
      const gj = await (await fetch(url, {cache:'force-cache'})).json();
      const lyr = L.geoJSON(gj, {
        renderer:L.canvas({padding:0.5}),
        style: style || {color:'#dc2626',weight:2,fillColor:'#fecaca',fillOpacity:.15},
        pointToLayer: (f,latlng)=>L.circleMarker(latlng,{radius:3})
      }).addTo(map);
      M2.layers.set(id, lyr);
      try{ map.fitBounds(lyr.getBounds(), {padding:[10,10]}); }catch(e){}
      setStatus('تم التحميل');
      return lyr;
    }

    function hideLayer(id){
      const lyr = M2.layers.get(id);
      if(lyr){ try{ map.removeLayer(lyr); }catch(e){} }
    }

    // أزرار
    document.getElementById('btnLoad2026').addEventListener('click', ()=>{
      ensureLayer('parcels2026','data/2026.json',{color:'#16a34a',weight:2,fillColor:'#bbf7d0',fillOpacity:.15});
    });
    document.getElementById('btnClear').addEventListener('click', ()=>{
      hideLayer('parcels2026'); setStatus('جاهز');
    });
    document.getElementById('btnPrint').addEventListener('click', ()=>{
      window.print();
    });

    // حالة الطباعة
    window.addEventListener('beforeprint', ()=> setStatus('وضع الطباعة'));
    window.addEventListener('afterprint',  ()=> setStatus('جاهز'));

  })();
  </script>
</body>
</html>
